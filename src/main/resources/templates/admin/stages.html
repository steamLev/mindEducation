<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление этапами - MindEducation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <i class="fas fa-cogs me-2"></i>Админ панель
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin">Главная</a>
                <a class="nav-link" href="/admin/characters">Персонажи</a>
                <a class="nav-link" href="/admin/locations">Локации</a>
                <a class="nav-link" href="/game">Игра</a>
            </div>
        </div>
    </nav>

    <!-- Заголовок -->
    <section class="py-4 bg-warning text-dark">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">
                    <i class="fas fa-graduation-cap me-2"></i>Управление этапами обучения
                </h2>
                <a href="/admin/stages/new" class="btn btn-dark">
                    <i class="fas fa-plus me-2"></i>Добавить этап
                </a>
            </div>
        </div>
    </section>

    <!-- Фильтры -->
    <section class="py-3 bg-light">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <select class="form-select" id="locationFilter">
                        <option value="">Все локации</option>
                        <option th:each="location : ${locations}" 
                                th:value="${location.id}" 
                                th:text="${location.name}">Локация</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="difficultyFilter">
                        <option value="">Все уровни сложности</option>
                        <option value="EASY">Легкий</option>
                        <option value="MEDIUM">Средний</option>
                        <option value="HARD">Сложный</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" id="searchStage" placeholder="Поиск по названию...">
                </div>
            </div>
        </div>
    </section>

    <!-- Список этапов -->
    <section class="py-5">
        <div class="container">
            <div class="row" th:if="${stages != null and !stages.empty}">
                <div class="col-md-6 col-lg-4 mb-4" th:each="stage : ${stages}">
                    <div class="card h-100" th:attr="data-location=${stage.location?.id}, data-difficulty=${stage.difficultyLevel}">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="mb-0" th:text="${stage.location?.name}">Локация</h6>
                                <span class="badge" 
                                      th:classappend="${stage.difficultyLevel == 'EASY'} ? 'bg-success' : 
                                                    (stage.difficultyLevel == 'MEDIUM') ? 'bg-warning text-dark' : 'bg-danger'"
                                      th:text="${stage.difficultyLevel}">Сложность</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${stage.title}">Название этапа</h5>
                            <p class="card-text" th:text="${stage.description}">Описание</p>
                            
                            <div class="row text-center">
                                <div class="col-4">
                                    <small class="text-muted">Порядок</small>
                                    <div class="fw-bold" th:text="${stage.stageOrder}">1</div>
                                </div>
                                <div class="col-4">
                                    <small class="text-muted">Время</small>
                                    <div class="fw-bold" th:text="${stage.estimatedDuration} + ' мин'">15 мин</div>
                                </div>
                                <div class="col-4">
                                    <small class="text-muted">Статус</small>
                                    <div class="fw-bold" th:text="${stage.isActive} ? 'Активен' : 'Неактивен'">Активен</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="btn-group w-100" role="group">
                                <a th:href="@{/admin/stages/edit/{id}(id=${stage.id})}" 
                                   class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-edit me-1"></i>Редактировать
                                </a>
                                <a th:href="@{/game/stage/{id}(id=${stage.id})}" 
                                   class="btn btn-outline-info btn-sm">
                                    <i class="fas fa-eye me-1"></i>Просмотр
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row" th:if="${stages == null or stages.empty}">
                <div class="col-12 text-center">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        Этапы обучения не найдены. <a href="/admin/stages/new">Создайте первый этап</a>.
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 MindEducation. Админ панель.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Фильтрация этапов
        document.getElementById('locationFilter').addEventListener('change', filterStages);
        document.getElementById('difficultyFilter').addEventListener('change', filterStages);
        document.getElementById('searchStage').addEventListener('input', filterStages);
        
        function filterStages() {
            const locationFilter = document.getElementById('locationFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const searchFilter = document.getElementById('searchStage').value.toLowerCase();
            
            const cards = document.querySelectorAll('.card[data-location]');
            
            cards.forEach(card => {
                const cardLocation = card.getAttribute('data-location');
                const cardDifficulty = card.getAttribute('data-difficulty');
                const cardTitle = card.querySelector('.card-title').textContent.toLowerCase();
                
                const locationMatch = !locationFilter || cardLocation === locationFilter;
                const difficultyMatch = !difficultyFilter || cardDifficulty === difficultyFilter;
                const searchMatch = !searchFilter || cardTitle.includes(searchFilter);
                
                if (locationMatch && difficultyMatch && searchMatch) {
                    card.parentElement.style.display = 'block';
                } else {
                    card.parentElement.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
