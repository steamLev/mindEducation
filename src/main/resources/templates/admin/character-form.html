<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование персонажа - MindEducation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <i class="fas fa-cogs me-2"></i>Админ панель
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/characters">Персонажи</a>
                <a class="nav-link" href="/game">Игра</a>
            </div>
        </div>
    </nav>

    <!-- Форма персонажа -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0">
                                <i class="fas fa-user me-2"></i>
                                <span th:text="${character.id != null} ? 'Редактирование персонажа' : 'Создание персонажа'">
                                    Создание персонажа
                                </span>
                            </h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/characters}" th:object="${character}" method="post">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="name" class="form-label">Имя персонажа *</label>
                                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="age" class="form-label">Возраст *</label>
                                            <input type="number" class="form-control" id="age" th:field="*{age}" 
                                                   min="1" max="18" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="gender" class="form-label">Пол *</label>
                                            <select class="form-select" id="gender" th:field="*{gender}" required>
                                                <option value="">Выберите пол</option>
                                                <option value="Мальчик">Мальчик</option>
                                                <option value="Девочка">Девочка</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="avatarUrl" class="form-label">URL аватара</label>
                                            <input type="url" class="form-control" id="avatarUrl" th:field="*{avatarUrl}">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Описание персонажа</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" 
                                              rows="4" placeholder="Опишите характер и особенности персонажа"></textarea>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label" for="isActive">
                                        Активный персонаж
                                    </label>
                                </div>
                                
                                <div class="d-flex justify-content-between">
                                    <a href="/admin/characters" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Назад
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Сохранить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 MindEducation. Админ панель.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
