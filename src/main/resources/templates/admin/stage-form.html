<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование этапа - MindEducation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <i class="fas fa-cogs me-2"></i>Админ панель
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/stages">Этапы</a>
                <a class="nav-link" href="/game">Игра</a>
            </div>
        </div>
    </nav>

    <!-- Форма этапа -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0">
                                <i class="fas fa-graduation-cap me-2"></i>
                                <span th:text="${stage.id != null} ? 'Редактирование этапа' : 'Создание этапа'">
                                    Создание этапа
                                </span>
                            </h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/stages}" th:object="${stage}" method="post">
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="mb-3">
                                            <label for="title" class="form-label">Название этапа *</label>
                                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="stageOrder" class="form-label">Порядковый номер *</label>
                                            <input type="number" class="form-control" id="stageOrder" 
                                                   th:field="*{stageOrder}" min="1" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Описание этапа *</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" 
                                              rows="3" required></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="learningObjectives" class="form-label">Цели обучения</label>
                                    <textarea class="form-control" id="learningObjectives" 
                                              th:field="*{learningObjectives}" rows="2"></textarea>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="estimatedDuration" class="form-label">Время (минуты)</label>
                                            <input type="number" class="form-control" id="estimatedDuration" 
                                                   th:field="*{estimatedDuration}" min="1">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="difficultyLevel" class="form-label">Уровень сложности</label>
                                            <select class="form-select" id="difficultyLevel" th:field="*{difficultyLevel}">
                                                <option value="">Выберите уровень</option>
                                                <option value="EASY">Легкий</option>
                                                <option value="MEDIUM">Средний</option>
                                                <option value="HARD">Сложный</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="mb-3">
                                            <label for="location" class="form-label">Локация *</label>
                                            <select class="form-select" id="location" th:field="*{location}" required>
                                                <option value="">Выберите локацию</option>
                                                <option th:each="loc : ${locations}" 
                                                        th:value="${loc.id}" 
                                                        th:text="${loc.name}">Локация</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label" for="isActive">
                                        Активный этап
                                    </label>
                                </div>
                                
                                <div class="d-flex justify-content-between">
                                    <a href="/admin/stages" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Назад
                                    </a>
                                    <button type="submit" class="btn btn-warning">
                                        <i class="fas fa-save me-2"></i>Сохранить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 MindEducation. Админ панель.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
