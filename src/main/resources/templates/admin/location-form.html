<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование локации - MindEducation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <i class="fas fa-cogs me-2"></i>Админ панель
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/locations">Локации</a>
                <a class="nav-link" href="/game">Игра</a>
            </div>
        </div>
    </nav>

    <!-- Форма локации -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0">
                                <i class="fas fa-map me-2"></i>
                                <span th:text="${location.id != null} ? 'Редактирование локации' : 'Создание локации'">
                                    Создание локации
                                </span>
                            </h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/locations}" th:object="${location}" method="post">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Название локации *</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Описание локации *</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" 
                                              rows="4" required></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="historicalPeriod" class="form-label">Исторический период *</label>
                                    <input type="text" class="form-control" id="historicalPeriod" 
                                           th:field="*{historicalPeriod}" 
                                           placeholder="например: 753 г. до н.э. - 476 г. н.э." required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="imageUrl" class="form-label">URL изображения</label>
                                    <input type="url" class="form-control" id="imageUrl" th:field="*{imageUrl}">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="backgroundMusic" class="form-label">Фоновая музыка</label>
                                    <input type="text" class="form-control" id="backgroundMusic" 
                                           th:field="*{backgroundMusic}">
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label" for="isActive">
                                        Активная локация
                                    </label>
                                </div>
                                
                                <div class="d-flex justify-content-between">
                                    <a href="/admin/locations" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Назад
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save me-2"></i>Сохранить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 MindEducation. Админ панель.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
