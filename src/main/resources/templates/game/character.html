<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${character.name} + ' - MindEducation'">Персонаж - MindEducation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .character-header {
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            color: white;
            padding: 60px 0;
        }
        .character-avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/game">
                <i class="fas fa-graduation-cap me-2"></i>MindEducation
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/game">Главная</a>
                <a class="nav-link" href="/admin">Админ панель</a>
            </div>
        </div>
    </nav>

    <!-- Заголовок персонажа -->
    <section class="character-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center">
                    <img th:src="${character.avatarUrl}" 
                         th:alt="${character.name}"
                         class="character-avatar"
                         src="/images/default-avatar.png">
                </div>
                <div class="col-md-8">
                    <h1 class="display-4" th:text="${character.name}">Имя персонажа</h1>
                    <p class="lead" th:text="${character.age} + ' лет'">Возраст</p>
                    <p class="mb-0" th:text="${character.gender}">Пол</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Описание персонажа -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <h3>О персонаже</h3>
                    <p class="lead" th:text="${character.description}">Описание персонажа</p>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Информация</h5>
                        </div>
                        <div class="card-body">
                            <p><strong>Имя:</strong> <span th:text="${character.name}">Имя</span></p>
                            <p><strong>Возраст:</strong> <span th:text="${character.age} + ' лет'">Возраст</span></p>
                            <p><strong>Пол:</strong> <span th:text="${character.gender}">Пол</span></p>
                            <p><strong>Статус:</strong> 
                                <span class="badge" th:classappend="${character.isActive} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${character.isActive} ? 'Активен' : 'Неактивен'">Статус</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Действия -->
    <section class="py-5 bg-light">
        <div class="container">
            <h3 class="text-center mb-4">Выберите действие</h3>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <a href="/game" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-play me-2"></i>Начать игру
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a href="/game" class="btn btn-outline-primary w-100 btn-lg">
                        <i class="fas fa-map me-2"></i>Выбрать локацию
                    </a>
                </div>
                <div class="col-md-4 mb-3">
                    <a href="/game" class="btn btn-outline-secondary w-100 btn-lg">
                        <i class="fas fa-arrow-left me-2"></i>Назад к выбору
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 MindEducation. Образовательная игра для изучения истории.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
