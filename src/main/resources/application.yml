server:
  port: 8080

spring:
  application:
    name: mind-education
  
  datasource:
    url: jdbc:postgresql://localhost:5432/mindeducation
    username: mindeducation
    password: mindeducation
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

logging:
  level:
    com.mindeducation: DEBUG
    org.springframework.web: DEBUG
